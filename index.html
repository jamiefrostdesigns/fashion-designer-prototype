<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fashion Designer App MVP</title><style>
*{box-sizing:border-box}body{margin:0;background:#dedede;color:#151515;font:15px Arial,sans-serif}.app{max-width:430px;min-height:100vh;margin:auto;background:#f7f7f7;padding:0 20px 86px;box-shadow:0 0 28px #aaa}header{height:62px;border-bottom:1px solid #ccc;display:flex;align-items:center;justify-content:space-between}.brand,small{font-size:11px;font-weight:800;letter-spacing:1px;color:#555}button,input,select,textarea{font:inherit}button{cursor:pointer}.link{border:0;background:none;font-weight:700}.title{margin:22px 0 17px}.title h1{font-size:27px;line-height:1.15;margin:5px 0}.title p,p{color:#666;line-height:1.45;margin:5px 0}h2{font-size:16px;margin:25px 0 10px}h3{font-size:16px;margin:6px 0}.btn{width:100%;min-height:48px;border:2px solid #111;background:#111;color:#fff;font-weight:800;padding:11px;margin:6px 0}.btn.alt{background:#fff;color:#111}.btn:disabled{opacity:.35}.card,.choice{width:100%;background:#fff;border:1px solid #bbb;padding:15px;margin:9px 0;text-align:left}.choice{display:flex;justify-content:space-between;align-items:center}.chip{display:inline-block;border:1px solid #777;border-radius:20px;padding:4px 8px;font-size:10px;font-weight:800;text-transform:uppercase}.row,.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.row .card{margin:0}.field{display:block;margin:13px 0}.field b{display:block;font-size:13px;margin-bottom:6px}.field input,.field textarea,.field select,.search{width:100%;min-height:46px;border:1px solid #999;background:#fff;padding:10px}.field textarea{height:90px}.field-head{display:flex;align-items:center;justify-content:space-between}.remove-field{border:0;background:none;color:#666;font-size:21px;line-height:1;padding:0 4px}.undo{display:flex;align-items:center;justify-content:space-between;border:1px solid #999;background:#eee;padding:10px 12px;margin:10px 0}.undo button{border:0;background:none;font-weight:800;text-decoration:underline}.client{display:flex;align-items:center;gap:11px}.avatar{width:40px;height:40px;border-radius:50%;background:#ddd;display:grid;place-items:center;font-weight:800}.grow{flex:1}.tabs{display:flex;overflow:auto;border-bottom:1px solid #aaa}.tabs button{border:0;background:none;padding:12px;white-space:nowrap}.tabs .on{border-bottom:3px solid;font-weight:800}.check{display:flex;align-items:center;gap:11px;border-bottom:1px solid #ddd;padding:13px 0}.dot{width:25px;height:25px;border:2px solid #999;border-radius:50%;display:grid;place-items:center}.dot.ok{background:#111;color:#fff;border-color:#111}.progress{height:5px;background:#ddd;margin-bottom:20px}.progress i{display:block;height:100%;background:#111}.actions{display:flex;gap:8px}.empty,.process{border:1px dashed #999;padding:27px;text-align:center;color:#666}.toast{position:fixed;z-index:6;top:10px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:10px 14px}.modal{position:fixed;z-index:5;inset:0;background:#0008;display:flex;align-items:end;justify-content:center}.sheet{width:min(430px,100%);background:#f7f7f7;padding:22px 20px 28px;border-radius:18px 18px 0 0}.preview{height:100px;background:linear-gradient(135deg,#aaa,#eee);display:grid;place-items:center;border:1px solid #777;font-weight:800;color:#444;margin-top:10px}nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;height:68px;background:#fff;border-top:1px solid #aaa;display:flex}nav button{flex:1;border:0;background:none;color:#777;text-transform:capitalize}nav .on{font-weight:800;color:#111}@media(min-width:700px){body{padding:20px}.app{min-height:calc(100vh - 40px);border-radius:18px}nav{bottom:20px;border-radius:0 0 18px 18px}}
</style></head><body><div id="root"></div><script>
const seed={clients:[],templates:[],orders:[]};
let data=JSON.parse(sessionStorage.fashionEmptyDemo||'null')||structuredClone(seed),page='orders',history=[],cid=null,oid=null,toast='',tab='Pre-Production',wizard=null,modal='',measurementReturnOrder=null;
const $=s=>document.querySelector(s),numberValue=v=>Number(String(v||'').replace(/,/g,''))||0,money=n=>'₦'+numberValue(n).toLocaleString('en-NG'),formatCurrencyInput=el=>{let digits=el.value.replace(/\D/g,'');el.value=digits?Number(digits).toLocaleString('en-NG'):''},client=id=>data.clients.find(c=>c.id==id),order=id=>data.orders.find(o=>o.id==id),date=v=>new Date(v+'T12:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
function persist(){sessionStorage.fashionEmptyDemo=JSON.stringify(data)}function go(p){history.push(page);page=p;render();scrollTo(0,0)}function back(){page=history.pop()||'orders';render()}function note(x){toast=x;render();setTimeout(()=>{toast='';render()},1600)}function title(h,p='',e=''){return `<section class=title>${e?`<small>${e}</small>`:''}<h1>${h}</h1>${p?`<p>${p}</p>`:''}</section>`}function fld(l,id,v='',type='text',area=false){return `<label class=field><b>${l}</b>${area?`<textarea id="${id}">${v}</textarea>`:`<input id="${id}" type="${type}" value="${v}">`}</label>`}function timelineText(v,u='days'){let n=numberValue(v)||1,unit=u||'days';if(n==1)unit=unit.replace(/s$/,'');return `${n} ${unit}`}function expectedDate(o){if(!o.paymentDate||!o.timeline)return'';let d=new Date(o.paymentDate+'T12:00:00'),n=numberValue(o.timeline),u=o.timelineUnit||'days';if(u=='months')d.setMonth(d.getMonth()+n);else d.setDate(d.getDate()+n*(u=='weeks'?7:1));return d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})}function orderCard(o){let timing=expectedDate(o)?`Expected ${expectedDate(o)}`:`Within ${timelineText(o.timeline,o.timelineUnit)} after payment`;return `<button class="card" onclick="oid=${o.id};go('order')"><span class=chip>${o.status}</span><h3>${o.item}</h3><p>${client(o.cid).name} · ${timing}</p></button>`}
function render(){persist();let views={orders:view_orders,clients:view_clients,settings:view_settings,addClient:view_addClient,client:view_client,measure:view_measure,measureReview:view_measureReview,measurementsView:view_measurementsView,payment:view_payment,order:view_order};let body=(views[page]||view_orders)(),nav=!['addClient','measure','measureEntry','measureReview','measurementsView','wizard','clientForm','payment'].includes(page),active=page=='order'?'orders':page=='client'?'clients':page;$('#root').innerHTML=`<div class=app><header>${history.length&&page!='orders'?'<button class=link onclick=back()>← Back</button>':'<span class=brand>STUDIO WORK</span>'}<button class=link onclick=resetDemo()>↻ Reset demo</button></header>${toast?`<div class=toast>${toast}</div>`:''}${body}${nav?`<nav>${['orders','clients','settings'].map(x=>`<button class="${active==x?'on':''}" onclick="go('${x}')">${x}</button>`).join('')}</nav>`:''}</div>${modal?modalView():''}`}
function resetDemo(){data=structuredClone(seed);sessionStorage.removeItem('fashionDemo');sessionStorage.removeItem('fashionEmptyDemo');page='clients';history=[];cid=null;oid=null;wizard=null;modal='';tab='Pre-Production';toast='Prototype reset';render()}function modalView(){if(modal=='templateChoice')return `<div class=modal><div class=sheet><h2>Save this structure as a template?</h2><p>Templates keep field names and order, not a client’s measurements.</p><button class=btn onclick="modal='templateName';render()">Save as Template</button><button class="btn alt" onclick="modal='';finishMeasurements()">Not now</button></div></div>`;return `<div class=modal><div class=sheet><h2>Name measurement template</h2>${fld('Template name','templateName','','text')}<button class=btn onclick=saveTemplate()>Save Template</button><button class="btn alt" onclick="modal='';finishMeasurements()">Cancel</button></div></div>`}
function view_dashboard(){let action=data.orders.filter(o=>o.status=='Awaiting Payment'),active=data.orders.filter(o=>['Preparing','In Production'].includes(o.status)),due=data.orders.filter(o=>o.status!='Completed'&&!action.includes(o)&&!active.includes(o));return title('Good morning, Ada','Here’s what needs your attention.')+`<button class=btn onclick="startWizard()">＋ Create Order</button><h2>Requires Action</h2>${action.map(orderCard).join('')||'<div class=empty>Nothing awaiting payment.</div>'}<h2>Active Work</h2><div class=row>${active.map(orderCard).join('')}</div><h2>Due Soon</h2>${due.map(orderCard).join('')||'<div class=empty>All due-soon orders are already shown above.</div>'}<h2>Recent Activity</h2><div class=card><b>Payment recorded</b><p>₦50,000 for Amara’s Emerald Aso Ebi Gown</p></div>`}
function view_clients(){if(!data.clients.length)return title('Clients','Clients will appear here after they are added.')+'<div class=empty><h3>No clients yet</h3><p>Add your first client to begin their profile and order journey.</p></div><button class=btn onclick="go(\'addClient\')">Add Client</button>';return title('Clients',`${data.clients.length} client${data.clients.length==1?'':'s'}`)+`<input class=search placeholder="Search clients" oninput="filterClients(this.value)"><button class=btn onclick="go('addClient')">＋ Add Client</button><div id=clients>${clientList('')}</div>`}function clientList(q){return data.clients.filter(c=>c.name.toLowerCase().includes(q.toLowerCase())).map(c=>`<button class="card client" onclick="cid=${c.id};go('client')"><span class=avatar>${c.name.split(' ').map(x=>x[0]).join('')}</span><span class=grow><b>${c.name}</b><p>${Object.keys(c.m).length?'Measurements added':'Measurements · Not Added'}</p></span>›</button>`).join('')||'<div class=empty>No clients match.</div>'}function filterClients(q){$('#clients').innerHTML=clientList(q)}
function view_addClient(){return title('Choose a method','','ADD CLIENT')+`<button class=choice onclick="clientForm()"><span><b>Add Manually</b><p>Enter client details</p></span>›</button><button class=choice onclick="contactImport()"><span><b>Import from Contacts</b><p>Simulated phone contacts</p></span>›</button><button class=choice onclick="scanClient()"><span><b>Upload / Scan</b><p>Simulated extraction</p></span>›</button>`}function clientForm(n='',p='',e='',a=''){page='clientForm';render();$('#root').querySelector('.app').innerHTML=`<header><button class=link onclick=back()>← Back</button><button class=link onclick=resetDemo()>↻ Reset demo</button></header>${title('Client details','','ADD CLIENT')}${fld('Full name','name',n)}${fld('Phone number','phone',p)}${fld('Email (optional)','email',e)}${fld('Address (optional)','address',a,'text',true)}<button class=btn onclick=saveClientForEntry()>Save Client</button><button class="btn alt" onclick=back()>Cancel</button>`}function saveClient(){let c={id:Date.now(),name:$('#name').value,phone:$('#phone').value,email:$('#email').value,address:$('#address').value,m:{}};if(!c.name||!c.phone)return note('Add a name and phone number.');data.clients.push(c);cid=c.id;history=[];page='client';note(`${c.name} added`)}function contactImport(){clientForm('Damilola Akin','0802 774 3051','','')}function scanClient(){page='clientForm';render();$('#root').querySelector('.app').innerHTML=`<header><button class=link onclick=back()>← Back</button><button class=link onclick=resetDemo()>↻ Reset demo</button></header>${title('Reading contact card…','Simulated extraction','UPLOAD / SCAN')}<div class=process>Extracting name and contact details…</div><button class="btn alt" onclick=back()>Cancel</button>`;setTimeout(()=>clientForm('Kemi Adeyemi','0812 300 4490','kemi@example.com',''),700)}
function view_client(){let c=client(cid)||data.clients[0],has=Object.keys(c.m).length,os=data.orders.filter(o=>o.cid==c.id),active=os.filter(o=>o.status!='Completed'),past=os.filter(o=>o.status=='Completed');return title(c.name,'Client profile')+`<div class=card><b>${c.phone}</b><p>${c.email}</p></div><button class=btn onclick=startWizard()>Create Order</button><div class=actions>${has?'<button class="btn alt" onclick="go(\'measurementsView\')">View Measurements</button><button class="btn alt" onclick="go(\'measure\')">Update Measurements</button>':'<button class="btn alt" onclick="go(\'measure\')">Add Measurements</button>'}</div><h2>Measurements</h2><div class=card>${has?`<div class=grid>${Object.entries(c.m).map(([k,v])=>`<div><small>${k}</small><b>${v}</b></div>`).join('')}</div>`:'<div class=empty>No measurements added yet.</div>'}</div><h2>Active Order</h2>${active.map(orderCard).join('')||'<div class=empty>No active order.</div>'}<h2>Order History</h2>${past.map(orderCard).join('')||'<div class=empty>No completed orders yet.</div>'}`}
function view_measurementsView(){let c=client(cid);return title('Measurements',c.name,'CLIENT PROFILE')+`<div class=card><div class=grid>${Object.entries(c.m).map(([k,v])=>`<div><small>${k}</small><b>${v}</b></div>`).join('')}</div></div><button class=btn onclick="go('measure')">Update Measurements</button><button class="btn alt" onclick=back()>Back to Client</button>`}
function view_measure(){let ts=data.templates||[];return title('Choose a method',`For ${client(cid).name}`,'ADD MEASUREMENTS')+`${ts.length?`<h2>Start with a template</h2>${ts.map((t,i)=>`<button class=choice onclick="measureForm('template',${i})"><span><b>${t.name}</b><p>${t.fields.join(' · ')}</p></span>›</button>`).join('')}`:''}<h2>${ts.length?'Or start from scratch':'Start from scratch'}</h2><button class=choice onclick="measureForm('voice')"><span><b>Capture Measurements</b><p>Simulated progressive voice capture</p></span>›</button><button class=choice onclick="measureForm('manual')"><span><b>Enter Manually</b><p>Fully editable fields</p></span>›</button><button class=choice onclick="measureForm('scan')"><span><b>Upload / Scan</b><p>Simulated sheet extraction</p></span>›</button>`}
let measureDraft={};function measureForm(mode,index){let fields=mode=='template'?data.templates[index].fields:['Bust','Waist','Hips','Shoulder','Length'],vals=mode=='scan'?['90 cm','72 cm','99 cm','38 cm','146 cm']:mode=='voice'?['92 cm','74 cm','101 cm','39 cm','148 cm']:fields.map(f=>client(cid).m[f]||'');measureDraft={fields,vals};if(mode=='voice'||mode=='scan'){page='measureEntry';render();$('#root').querySelector('.app').innerHTML=`<header><button class=link onclick=back()>← Back</button><button class=link onclick=resetDemo()>↻ Reset demo</button></header>${title(mode=='voice'?'Listening and capturing…':'Reading measurement sheet…','Simulated capture in progress','ADD MEASUREMENTS')}<div class=process>Measurements are appearing progressively…</div><button class="btn alt" onclick=back()>Cancel</button>`;setTimeout(drawMeasureEntry,700)}else drawMeasureEntry()}function drawMeasureEntry(){page='measureEntry';render();let b=title('Enter measurements','You can review before saving.','ADD MEASUREMENTS')+measureDraft.fields.map((n,i)=>fld(n,'m'+i,measureDraft.vals[i])).join('')+'<div id=custom></div><button class="btn alt" onclick=addCustom()>＋ Add Custom Measurement</button><button class=btn onclick=reviewMeasurements()>Review Measurements</button><button class="btn alt" onclick=back()>Cancel</button>';$('#root').querySelector('.app').innerHTML=`<header><button class=link onclick=back()>← Back</button><button class=link onclick=resetDemo()>↻ Reset demo</button></header>${b}`}function addCustom(){let n=measureDraft.fields.length;measureDraft.fields.push('');measureDraft.vals.push('');let x=document.createElement('div');x.className='custom';x.innerHTML=fld('Custom name','m'+n+'name')+fld('Value','m'+n+'value');$('#custom').appendChild(x)}function reviewMeasurements(){let fields=[...measureDraft.fields],vals=[];fields.forEach((f,i)=>{let name=$('#m'+i+'name')?.value||f,value=$('#m'+i+'value')?.value||$('#m'+i)?.value;if(name&&value){fields[i]=name;vals[i]=value}else{fields[i]='';vals[i]=''}});measureDraft={fields:fields.filter(Boolean),vals:vals.filter((v,i)=>fields[i])};page='measureReview';render()}function view_measureReview(){return title('Review Measurements','Confirm the values before saving.','ADD MEASUREMENTS')+`<div class=card>${measureDraft.fields.map((f,i)=>`<div class=check><b>${f}</b><span>${measureDraft.vals[i]}</span></div>`).join('')}</div><button class=btn onclick=saveMeasurements()>Save Measurements</button><button class="btn alt" onclick="page='measureEntry';render()">Back</button><button class="btn alt" onclick=back()>Cancel</button>`}function saveMeasurements(){let m={};measureDraft.fields.forEach((f,i)=>m[f]=measureDraft.vals[i]);client(cid).m=m;persist();modal='templateChoice';render()}function saveTemplate(){let name=$('#templateName').value.trim();if(!name)return note('Enter a template name.');data.templates.push({name,fields:[...measureDraft.fields]});modal='';finishMeasurements();note(`Template “${name}” saved`)}function finishMeasurements(){page='client';history=[];persist();note('Measurements saved')}
function startWizard(){wizard={step:0,cid:cid||data.clients[0]?.id,item:'',price:'',timeline:'7',refs:'',brief:'',shared:false};page='wizard';history=[];drawWizard()}function capture(){['item','price','timeline','refs','brief'].forEach(k=>{if($('#'+k))wizard[k]=$('#'+k).value});if($('#wc'))wizard.cid=+$('#wc').value}function drawWizard(){let s=wizard.step,names=['Select Client','Order Details','Set Delivery Timeline','Add Design References','Review Order Details'],b='';if(s==0)b=`<select id=wc class=search>${data.clients.map(c=>`<option value=${c.id} ${c.id==wizard.cid?'selected':''}>${c.name}</option>`).join('')}</select>`;if(s==1)b=fld('Garment / order name','item',wizard.item)+`<label class=field><b>Agreed price (₦)</b><input id=price inputmode=numeric value="${wizard.price}" oninput="formatCurrencyInput(this)"></label>`+fld('Design requirements','brief',wizard.brief,'text',true);if(s==2)b=`<label class=field><b>Complete within</b><input id=timeline type=number min=1 value="${wizard.timeline}"></label><div class=card><b>${wizard.timeline||7} days after payment confirmation</b><p>The expected delivery date can be calculated after payment is recorded.</p></div>`;if(s==3)b=`${fld('Reference link or note','refs',wizard.refs)}<div class=actions><button class="btn alt" onclick="wizard.refs='Photo reference attached';drawWizard()">Take photo</button><button class="btn alt" onclick="wizard.refs='Image reference uploaded';drawWizard()">Upload image</button></div>${wizard.refs?`<div class=preview>✓ ${wizard.refs}</div>`:'<div class=card>Attach a reference to simulate an uploaded image or link.</div>'}`;if(s==4)b=brief()+`<div class=card>${wizard.shared?'<b>✓ Shared with client for approval</b><p>Simulated share completed successfully.</p><button class="btn alt" onclick="wizard.shared=false;drawWizard()">Share Again</button>':'<p>Client approval is optional for this order.</p><button class=btn onclick="wizard.shared=true;drawWizard()">Share with Client for Approval</button>'}</div>${wizard.shared?'<button class=btn onclick="finishOrder(true)">Mark as Approved</button>':''}<button class="btn alt" onclick="finishOrder(false)">Continue Without Approval</button>`;$('#root').innerHTML=`<div class=app><header><button class=link onclick="wizard.step? (capture(),wizard.step--,drawWizard()):back()">← Back</button><button class=link onclick=resetDemo()>↻ Reset demo</button></header>${title(names[s],'',`NEW ORDER · ${s+1} OF 5`)}<div class=progress><i style="width:${(s+1)/5*100}%"></i></div>${b}${s<4?`<button class=btn onclick=nextWizard()>Continue</button><button class="btn alt" onclick=back()>Cancel</button>`:''}</div>`}function brief(){return `<div class=card><span class=chip>ORDER SUMMARY</span><h3>${wizard.item||'Untitled garment'}</h3><p><b>Client</b><br>${client(wizard.cid).name}</p><p><b>Delivery timeline</b><br>Within ${wizard.timeline||7} days after payment confirmation</p><p><b>Agreed price</b><br>${money(wizard.price)}</p><p><b>Design requirements</b><br>${wizard.brief||'None added'}</p><p><b>References</b><br>${wizard.refs||'None added'}</p></div>`}function nextWizard(){capture();if(wizard.step==1&&(!wizard.item||!numberValue(wizard.price)))return note('Add the order name and agreed price.');if(wizard.step==2&&(!numberValue(wizard.timeline)||numberValue(wizard.timeline)<1))return note('Add a delivery timeline in days.');wizard.step++;drawWizard()}function finishOrder(approved){let o={id:Date.now(),cid:wizard.cid,item:wizard.item,timeline:numberValue(wizard.timeline),price:numberValue(wizard.price),paid:0,paymentPlan:'',status:'Awaiting Payment',materials:'unselected',approved,brief:wizard.brief,reference:wizard.refs};data.orders.push(o);oid=o.id;cid=o.cid;page='order';history=[];note(approved?'Order approved — awaiting payment':'Order created without approval — awaiting payment')}
function phase(o){let status=String(o.status||'').trim();return status=='Completed'?'Completed':['In Production','Ready for Delivery'].includes(status)?'Production':'Pre-Production'}function setOrderTab(t){tab=t;render()}function view_orders(){if(!data.orders.length){let action=data.clients.length?'<button class=btn onclick="go(\'clients\')">Go to Clients</button>':'<button class=btn onclick="go(\'addClient\')">Add Client</button>';return title('Orders','Orders will appear here after you create an order for a client.')+'<div class=empty><h3>No orders yet</h3><p>Create an order from a client profile when you are ready.</p></div>'+action}let matching=data.orders.filter(o=>phase(o)==tab);return title('Orders','Track work from draft to completion.')+`<div class=tabs>${['Pre-Production','Production','Completed'].map(x=>`<button class="${tab==x?'on':''}" onclick="setOrderTab('${x}')">${x}</button>`).join('')}</div><div id=olist>${matching.length?matching.map(orderCard).join(''):'<div class=empty>No orders in this phase.</div>'}</div>`}
function check(ok,label,sub){return `<div class=check><span class="dot ${ok?'ok':''}">${ok?'✓':''}</span><span><b>${label}</b><p>${sub}</p></span></div>`}function paymentMet(o){return o.paid>0}function transition(status,message){let o=order(oid);o.status=status;persist();page='order';history=[];note(message)}function materialLabel(m){return m=='ready'?'Materials ready':m=='notRequired'?'Materials not required':m=='pending'?'Still pending':'Not selected'}function chooseMaterials(m){order(oid).materials=m;persist();render()}function materialState(o){if(o.materials=='unselected')return `<div class=actions><button class="btn alt" onclick="chooseMaterials('ready')">Materials ready</button><button class="btn alt" onclick="chooseMaterials('notRequired')">Not required</button><button class="btn alt" onclick="chooseMaterials('pending')">Still pending</button></div>`;if(o.materials=='pending')return `<div class=card><b>○ Still pending</b><p>Materials are blocking production readiness.</p></div><button class=btn onclick="chooseMaterials('unselected')">Review Materials</button>`;return `<div class=card><b>✓ ${materialLabel(o.materials)}</b><button class="link" onclick="chooseMaterials('unselected')">Change</button></div>`}function view_order(){let o=order(oid)||data.orders[0],c=client(o.cid),bal=Math.max(0,o.price-o.paid),has=Object.keys(c.m).length>0,pmet=paymentMet(o),ready=pmet&&has&&['ready','notRequired'].includes(o.materials);let paymentText=!o.paid?'Not recorded':bal<=0?'Paid in full':`Deposit received · ${money(o.paid)} paid · ${money(bal)} outstanding`;let delivery=`Within ${o.timeline||'—'} days after payment confirmation${expectedDate(o)?` · Expected ${expectedDate(o)}`:''}`;let b=title(o.item,c.name)+`<span class=chip>${o.status}</span><div class=card><p><b>Delivery timeline</b><br>${delivery}</p><p><b>Design brief</b><br>${o.brief||'None added'}</p>${o.reference?`<div class=preview>✓ ${o.reference}</div>`:''}<p><b>Payment</b><br>${paymentText}</p><p><b>Client approval</b><br>${o.approved?'✓ Approved':'Skipped — continued without approval'}</p></div>`;if(o.status=='Awaiting Payment')b+='<button class=btn onclick="go(\'payment\')">Record Payment</button>';if(o.status=='Preparing')b+=`<h2>Preparation</h2><div class=card>${check(pmet,bal<=0?'Paid in full':'Deposit received',pmet?(bal>0?`${money(bal)} outstanding`:`${money(o.paid)} recorded`):'No payment recorded')}${check(has,'Measurements',has?'Available on client profile':'Add from client profile')}${check(['ready','notRequired'].includes(o.materials),'Materials',materialLabel(o.materials))}</div><h2>Materials</h2>${materialState(o)}${bal>0?'<button class="btn alt" onclick="go(\'payment\')">Record Payment</button>':''}<button class=btn ${ready?'':'disabled'} onclick="transition('In Production','Production started')">Start Production</button>${ready?'':'<p>Record a payment, add measurements, and resolve materials before starting production.</p>'}`;if(o.status=='In Production')b+='<div class=card><h3>Production in progress</h3><p>No cutting, sewing, or fitting sub-stages.</p></div><button class=btn onclick="transition(\'Ready for Delivery\',\'Order marked ready for delivery\')">Mark Ready for Delivery</button>';if(o.status=='Ready for Delivery')b+='<div class=card><h3>Ready for delivery</h3><p>Confirm handover when complete.</p></div><button class=btn onclick="transition(\'Completed\',\'Order marked completed\')">Mark Completed</button>';if(o.status=='Completed')b+='<div class=card><h3>✓ Order completed</h3><p>Summary only.</p></div>';return b}
function view_payment(){let o=order(oid),bal=Math.max(0,o.price-o.paid),first=!o.paid;return title('Record Payment',o.item)+`<div class=card><p>Order total <b>${money(o.price)}</b></p><p>Paid so far <b>${money(o.paid)}</b></p><p>Outstanding balance <b>${money(bal)}</b></p></div>${first?`<label class="card check"><input type=radio name=plan value=full checked onchange="setPaymentAmount()"> Paid in full today</label><label class="card check"><input type=radio name=plan value=deposit onchange="setPaymentAmount()"> Deposit with balance later</label>`:''}<label class=field><b>Amount received (₦)</b><input id=amount inputmode=numeric value="${first?bal.toLocaleString('en-NG'):''}" oninput="formatCurrencyInput(this)"></label><button class=btn onclick=recordPayment()>Record Payment</button><button class="btn alt" onclick=back()>Cancel</button>`}function setPaymentAmount(){let o=order(oid),plan=document.querySelector('input[name=plan]:checked')?.value;if(plan=='full')$('#amount').value=Math.max(0,o.price-o.paid).toLocaleString('en-NG');else $('#amount').value=''}function recordPayment(){let o=order(oid),n=numberValue($('#amount').value),bal=o.price-o.paid,plan=document.querySelector('input[name=plan]:checked')?.value;if(!n||n>bal)return note('Enter an amount up to the outstanding balance.');if(!o.paid)o.paymentPlan=plan=='full'?'full':'deposit';if(plan=='full'&&n!=bal)return note('Paid in full must equal the outstanding balance.');if(plan=='deposit'&&n>=bal)return note('For a deposit, enter less than the order total.');o.paid+=n;o.paymentDate=o.paymentDate||new Date().toISOString().slice(0,10);if(o.paid>=o.price)o.paymentPlan='full';if(o.status=='Awaiting Payment')o.status='Preparing';persist();page='order';history=[];note(`${money(n)} payment recorded`)}function view_settings(){return title('Settings','Prototype preferences')+'<div class=card><h3>Moderated testing build</h3><p>Use Reset demo before each participant.</p></div>'}render();

function view_client(){let c=client(cid)||data.clients[0],has=Object.keys(c.m).length,os=data.orders.filter(o=>o.cid==c.id),active=os.filter(o=>o.status!='Completed'),past=os.filter(o=>o.status=='Completed'),updated=measurementDate(c).replace(/^Updated /,'Last updated · ');return title(c.name,'Client profile')+`<div class=card><b>${c.phone}</b><p>${c.email}</p></div><button class=btn onclick=startWizard()>Create Order</button><h2>Measurements</h2><div class=card>${has?`<b>${c.measurementSet||'Current measurement set'}</b><p>${updated}</p><button class="btn alt" onclick="go('measurementsView')">View</button>`:'<b>Measurements</b><p>No measurements added</p><button class="btn alt" onclick="go(\'measure\')">Add Measurements</button>'}</div><h2>Active Order</h2>${active.map(orderCard).join('')||'<div class=empty>No active order.</div>'}<h2>Order History</h2>${past.map(orderCard).join('')||'<div class=empty>No completed orders yet.</div>'}`}

const measurementSets={
  'Suit':['Chest','Waist','Hip','Shoulder','Sleeve Length','Jacket Length','Trouser Length','Thigh','Inseam'],
  'Shirt':['Chest','Shoulder','Sleeve Length','Neck','Shirt Length','Armhole'],
  'Trousers':['Waist','Hip','Thigh','Knee','Ankle','Inseam','Outseam'],
  'Skirt':['Waist','Hip','Skirt Length'],
  'Gown':['Bust','Waist','Hip','Shoulder','Sleeve Length','Armhole','Dress Length'],
  'Bridal':['Bust','Waist','Hip','Shoulder','Sleeve Length','Armhole','Dress Length'],
  'Native Wear':['Chest','Waist','Hip','Shoulder','Sleeve Length','Outfit Length']
};
function measurementShell(content,backAction="go('measure')"){$('#root').innerHTML=`<div class=app><header><button class=link onclick="${backAction}">← Back</button><button class=link onclick=resetDemo()>↻ Reset demo</button></header>${content}</div>`;scrollTo(0,0)}
function view_measure(){let ts=data.templates||[];return title('How would you like to add measurements?',`For ${client(cid).name}`,'ADD MEASUREMENTS')+`${ts.length?`<h2>Use a saved template</h2>${ts.map((t,i)=>`<button class=choice onclick="measureForm('template',${i})"><span><b>${t.name}</b><p>${t.fields.join(' · ')}</p></span>›</button>`).join('')}`:''}<h2>Capture method</h2><button class=choice onclick="measureForm('voice')"><span><b>Capture Measurements</b><p>Speak your measurements naturally as you take them.</p></span>›</button><button class=choice onclick="measureForm('manual')"><span><b>Enter Manually</b><p>Type measurements into suggested fields.</p></span>›</button><button class=choice onclick="measureForm('scan')"><span><b>Upload / Scan</b><p>Import measurements from a photo, document, or spreadsheet.</p></span>›</button>`}
function measureForm(mode,index){if(mode=='template'){let t=data.templates[index];measureDraft={mode:'manual',setName:t.name,fields:[...t.fields],vals:t.fields.map(f=>client(cid).m[f]||'')};return drawMeasureEntry()}measureDraft={mode,setName:'',fields:[],vals:[]};drawMeasurementContext()}
function drawMeasurementContext(){page='measureContext';let options=Object.keys(measurementSets).concat('Other / Custom');measurementShell(title('What are you measuring for?','Choose a measurement set before fields are suggested.','ADD MEASUREMENTS')+options.map(x=>`<button class=choice onclick="chooseMeasurementSet('${x.replace("'","\\'")}')"><span><b>${x}</b>${x=='Other / Custom'?'<p>Name your own set and start blank.</p>':''}</span>›</button>`).join(''))}
function chooseMeasurementSet(name){if(name=='Other / Custom')return drawCustomMeasurementSet();prepareMeasurementSet(name)}
function drawCustomMeasurementSet(){page='measureContext';measurementShell(title('Name your measurement set','Custom sets start with no suggested fields.','ADD MEASUREMENTS')+fld('Measurement set name','customSetName')+'<button class=btn onclick=confirmCustomMeasurementSet()>Continue</button><button class="btn alt" onclick=drawMeasurementContext()>Back</button>','drawMeasurementContext()')}
function confirmCustomMeasurementSet(){let name=$('#customSetName').value.trim();if(!name)return note('Enter a measurement set name.');prepareMeasurementSet(name,[])}
function sampleValue(field,i,mode){let existing=client(cid).m[field];if(existing)return existing;let voice=['92 cm','76 cm','101 cm','40 cm','61 cm','104 cm','108 cm','58 cm','80 cm'],scan=['90 cm','74 cm','99 cm','39 cm','60 cm','102 cm','106 cm','57 cm','79 cm'];return (mode=='voice'?voice:scan)[i]||`${70+i*3} cm`}
function prepareMeasurementSet(name,fields=measurementSets[name]||[]){measureDraft.setName=name;measureDraft.fields=[...fields];measureDraft.vals=fields.map((f,i)=>measureDraft.mode=='manual'?(client(cid).m[f]||''):sampleValue(f,i,measureDraft.mode));if(measureDraft.mode=='voice'||measureDraft.mode=='scan')drawCaptureProgress();else drawMeasureEntry()}
function drawCaptureProgress(){page='measureEntry';let verb=measureDraft.mode=='voice'?'Record':'Scan',heading=measureDraft.mode=='voice'?`Recording ${measureDraft.setName} Measurements…`:`Scanning ${measureDraft.setName} Measurements…`;measurementShell(title(heading,`Using the expected ${measureDraft.setName} fields as context.`,'ADD MEASUREMENTS')+`<div class=card><b>Measurement set</b><p>${measureDraft.setName}</p></div><div class=process>${verb=='Record'?'Listening for':'Extracting'} ${measureDraft.fields.join(', ')||'custom measurements'}…</div><button class="btn alt" onclick=drawMeasurementContext()>Cancel</button>`,'drawMeasurementContext()');setTimeout(drawMeasureEntry,500)}
let removedMeasurement=null;
function measurementField(name,i){return name?`<label class=field><span class=field-head><b>${name}</b><button class=remove-field type=button aria-label="Remove ${name}" onclick="removeMeasurement(${i})">×</button></span><input id="m${i}" value="${measureDraft.vals[i]||''}"></label>`:`<div class=custom><label class=field><span class=field-head><b>Custom name</b><button class=remove-field type=button aria-label="Remove custom measurement" onclick="removeMeasurement(${i})">×</button></span><input id="m${i}name" value=""></label>${fld('Value','m'+i+'value',measureDraft.vals[i]||'')}</div>`}
function syncMeasureDraft(){measureDraft.fields=measureDraft.fields.map((f,i)=>$('#m'+i+'name')?.value||f);measureDraft.vals=measureDraft.fields.map((f,i)=>$('#m'+i+'value')?.value||$('#m'+i)?.value||'')}
function drawMeasureEntry(){page='measureEntry';let action=measureDraft.mode=='voice'?'Capture':measureDraft.mode=='scan'?'Review Extracted':'Enter',heading=`${action} ${measureDraft.setName} Measurements`,sub=measureDraft.fields.length?'Suggested fields match this measurement set.':'No suggested fields. Add the measurements you need.',undo=removedMeasurement?`<div class=undo><span>${removedMeasurement.name||'Custom measurement'} removed</span><button onclick=undoRemoveMeasurement()>Undo</button></div>`:'';let b=title(heading,sub,'ADD MEASUREMENTS')+`<div class=card><b>Measurement set</b><p>${measureDraft.setName}</p></div>`+undo+measureDraft.fields.map(measurementField).join('')+'<button class="btn alt" onclick=addCustomMeasurement()>＋ Add Custom Measurement</button><button class=btn onclick=reviewMeasurements()>Review Measurements</button><button class="btn alt" onclick=drawMeasurementContext()>Cancel</button>';measurementShell(b,'drawMeasurementContext()')}
function removeMeasurement(i){syncMeasureDraft();removedMeasurement={index:i,name:measureDraft.fields[i],value:measureDraft.vals[i]};measureDraft.fields.splice(i,1);measureDraft.vals.splice(i,1);drawMeasureEntry()}
function undoRemoveMeasurement(){if(!removedMeasurement)return;measureDraft.fields.splice(removedMeasurement.index,0,removedMeasurement.name);measureDraft.vals.splice(removedMeasurement.index,0,removedMeasurement.value);removedMeasurement=null;drawMeasureEntry()}
function addCustomMeasurement(){syncMeasureDraft();measureDraft.fields.push('');measureDraft.vals.push('');removedMeasurement=null;drawMeasureEntry()}
function reviewMeasurements(){syncMeasureDraft();let pairs=measureDraft.fields.map((f,i)=>[f,measureDraft.vals[i]]).filter(([f,v])=>f&&v);measureDraft.fields=pairs.map(x=>x[0]);measureDraft.vals=pairs.map(x=>x[1]);removedMeasurement=null;page='measureReview';render()}
function view_measureReview(){return title('Review Measurements',`Measurement set: ${measureDraft.setName}`,'ADD MEASUREMENTS')+`<div class=card><b>${measureDraft.setName}</b>${measureDraft.fields.length?measureDraft.fields.map((f,i)=>`<div class=check><b>${f}</b><span>${measureDraft.vals[i]}</span></div>`).join(''):'<p>No measurements added yet.</p>'}</div><button class=btn ${measureDraft.fields.length?'':'disabled'} onclick=saveMeasurements()>Save Measurements</button><button class="btn alt" onclick=drawMeasureEntry()>Back</button><button class="btn alt" onclick=drawMeasurementContext()>Cancel</button>`}
function saveMeasurements(){let m={};measureDraft.fields.forEach((f,i)=>m[f]=measureDraft.vals[i]);let c=client(cid);c.m=m;c.measurementSet=measureDraft.setName;c.measurementUpdatedAt=new Date().toISOString().slice(0,10);persist();modal='templateChoice';render()}
function view_measurementsView(){let c=client(cid);return title(c.measurementSet?`${c.measurementSet} Measurements`:'Measurements',c.name,'CLIENT PROFILE')+`<div class=card><p>${measurementDate(c)}</p><div class=grid>${Object.entries(c.m).map(([k,v])=>`<div><small>${k}</small><b>${v}</b></div>`).join('')}</div></div><button class=btn onclick="go('measure')">Update Measurements</button><button class="btn alt" onclick="measurementReturnOrder?finishMeasurements():back()">${measurementReturnOrder?'Back to Order':'Back to Client'}</button>`}
</script></body></html>
